name: Registry regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  registry-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate registry JSON
        run: jq empty data/nodes.json data/repository-scope.json
      - name: Test complete enumeration and failure reporting
        run: python3 -m unittest discover -s tests -v
      - name: Compile audit scripts
        run: python3 -m py_compile scripts/audit_public_registry.py tests/test_audit_public_registry.py
      - name: Check patch whitespace
        run: git diff --check
